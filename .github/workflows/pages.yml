name: Deploy site

# Publishes ./site to GitHub Pages. The repository holds the site files; the only thing it does not hold is the
# DaggerSquare font (its licence allows embedding it in a website but not publishing the file), which is kept as the
# encrypted repository secret DAGGERSQUARE_B64 and written into the site folder here, only inside the deployed copy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Add the DaggerSquare font to the deployed copy
        env:
          DAGGERSQUARE_B64: ${{ secrets.DAGGERSQUARE_B64 }}
        # The font is optional: whatever goes wrong here, the site is still deployed and falls back to Oswald.
        run: |
          FONT=site/fonts/DaggerSquare-Oblique.otf
          if [ -z "$DAGGERSQUARE_B64" ]; then
            echo "::warning::Secret DAGGERSQUARE_B64 is not set: the site falls back to Oswald for driver names."
          else
            # Drop whitespace, line breaks and quotes a copy-paste may have added, then decode.
            if printf '%s' "$DAGGERSQUARE_B64" | tr -d '[:space:]"'"'" | base64 -d > "$FONT" 2>/dev/null && [ "$(head -c 4 "$FONT")" = "OTTO" ]; then
              echo "DaggerSquare added to the deployed site ($(wc -c < "$FONT") bytes)"
            else
              rm -f "$FONT"
              echo "::warning::Secret DAGGERSQUARE_B64 is not valid base64 of the .otf file: the site falls back to Oswald. Recreate the secret."
            fi
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
